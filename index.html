<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f7d5b">
  <title>쓰담쓰담 플로깅 신청</title>

  <style>
    :root {
      --green: #287755;
      --green-dark: #18543c;
      --green-soft: #eaf5ef;
      --cream: #fbfaf5;
      --ink: #24332c;
      --muted: #65736c;
      --line: #dbe6df;
      --danger: #c44747;
      --shadow: 0 18px 48px rgba(32, 75, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family:
        Pretendard,
        "Noto Sans KR",
        system-ui,
        -apple-system,
        sans-serif;
      background:
        radial-gradient(
          circle at 10% 0%,
          #dff3e6 0,
          transparent 30rem
        ),
        linear-gradient(
          180deg,
          #f4faf6 0%,
          var(--cream) 100%
        );
    }

    .wrap {
      width: min(100% - 32px, 680px);
      margin: 0 auto;
      padding: 44px 0 64px;
    }

    .hero {
      margin-bottom: 24px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(29px, 7vw, 40px);
      letter-spacing: -0.04em;
    }

    .hero p:last-child {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .card {
      padding: clamp(22px, 5vw, 36px);
      border: 1px solid rgba(40, 119, 85, 0.14);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .notice {
      margin: 0 0 28px;
      padding: 17px 18px;
      border-radius: 15px;
      background: var(--green-soft);
      font-size: 14px;
      line-height: 1.75;
    }

    .notice strong {
      color: var(--green-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 19px 16px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 750;
    }

    .required {
      color: var(--danger);
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      outline: none;
      transition: 0.18s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(40, 119, 85, 0.1);
    }

    input::placeholder {
      color: #a0aaa5;
    }

    select:disabled,
    input:disabled {
      color: #929b96;
      background: #f3f5f4;
      cursor: not-allowed;
    }

    .hint {
      min-height: 20px;
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .privacy {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 24px 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .privacy input {
      flex: 0 0 auto;
      width: 18px;
      min-height: 18px;
      margin-top: 1px;
      accent-color: var(--green);
    }

    button {
      width: 100%;
      min-height: 56px;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      color: #ffffff;
      background: var(--green);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(40, 119, 85, 0.22);
    }

    button:hover {
      background: var(--green-dark);
    }

    button:disabled {
      background: #aebbb4;
      box-shadow: none;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 17px;
      padding: 14px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
    }

    .status.show {
      display: block;
    }

    .status.info {
      color: #315a77;
      background: #edf6fc;
    }

    .status.success {
      color: #175b3d;
      background: #e8f7ee;
    }

    .status.error {
      color: #8d3030;
      background: #fdeeee;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      text-align: center;
      font-size: 12.5px;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(100% - 22px, 680px);
        padding-top: 28px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .card {
        border-radius: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">공릉종합사회복지관</p>
      <h1>쓰담쓰담 플로깅</h1>

      <p>
        우리 동네를 걸으며 쓰레기를 줍는<br>
        건강한 환경 활동에 함께해 주세요.
      </p>
    </header>

    <section class="card">
      <div class="notice">
        <strong>운영 안내</strong><br>
        날짜별 정원은 5명이며, 마감된 날짜는 선택할 수 없습니다.<br>
        토요일은 09:00~13:00에 운영하고
        <strong>일요일은 운영하지 않습니다.</strong>
      </div>

      <form
        id="applicationForm"
        method="post"
        target="submitFrame"
        novalidate
      >
        <div class="grid">
          <div class="field full">
            <label for="activityDate">
              활동 날짜 <span class="required">*</span>
            </label>

            <select
              id="activityDate"
              name="activityDate"
              required
              disabled
            >
              <option value="">
                일정을 불러오는 중입니다…
              </option>
            </select>

            <p
              class="hint"
              id="dateHint"
              aria-live="polite"
            ></p>
          </div>

          <div class="field">
            <label for="startTime">
              시작시간 <span class="required">*</span>
            </label>

            <select
              id="startTime"
              name="startTime"
              required
              disabled
            >
              <option value="">
                날짜를 먼저 선택해 주세요
              </option>
            </select>
          </div>

          <div class="field">
            <label for="activityTime">
              활동시간 <span class="required">*</span>
            </label>

            <select
              id="activityTime"
              name="activityTime"
              required
              disabled
            >
              <option value="">선택해 주세요</option>
              <option value="1">1시간</option>
              <option value="2">2시간</option>
            </select>

            <p
              class="hint"
              id="timeHint"
            ></p>
          </div>

          <div class="field">
            <label for="name">
              이름 <span class="required">*</span>
            </label>

            <input
              id="name"
              name="name"
              type="text"
              maxlength="30"
              autocomplete="name"
              placeholder="신청자 이름"
              required
            >
          </div>

          <div class="field">
            <label for="phone">
              연락처 <span class="required">*</span>
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              maxlength="13"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="010-0000-0000"
              required
            >
          </div>

          <div class="field full">
            <label for="vmsId">
              VMS 아이디
              <span style="color: var(--muted); font-weight: 500;">
                (선택)
              </span>
            </label>

            <input
              id="vmsId"
              name="vmsId"
              type="text"
              maxlength="50"
              autocomplete="off"
              placeholder="봉사실적 등록이 필요한 경우 입력해 주세요"
            >
          </div>
        </div>

        <label class="privacy">
          <input
            id="privacy"
            type="checkbox"
            required
          >

          <span>
            신청 접수 및 활동 안내를 위한 개인정보
            (이름, 연락처, VMS 아이디) 수집·이용에 동의합니다.
            수집 정보는 활동 운영 목적으로만 사용됩니다.
          </span>
        </label>

        <button
          id="submitButton"
          type="submit"
        >
          신청하기
        </button>

        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <iframe
        id="submitFrame"
        name="submitFrame"
        title="신청 처리"
        hidden
      ></iframe>
    </section>

    <footer>
      문의 · 공릉종합사회복지관<br>
      안전한 활동을 위해 현장 안내에 따라 주세요.
    </footer>
  </main>

  <script>
    "use strict";

    const API_URL =
  "https://script.google.com/macros/s/AKfycbz1nSLUaQI6rAkX7pCys4IxVJf8gn_W_N6wEDQG4rLdP3rKCO9yWE4ddY6or0Ah8BjNgA/exec";

    const form =
      document.getElementById("applicationForm");

    const dateSelect =
      document.getElementById("activityDate");

    const startSelect =
      document.getElementById("startTime");

    const durationSelect =
      document.getElementById("activityTime");

    const phoneInput =
      document.getElementById("phone");

    const submitButton =
      document.getElementById("submitButton");

    const statusBox =
      document.getElementById("status");

    const submitFrame =
      document.getElementById("submitFrame");

    let schedule = [];
    let waitingForSubmit = false;

    /*
      Apps Script에서 불러온 일정을 처리합니다.
      서버에서 일요일을 제외하더라도
      홈페이지에서 한 번 더 일요일을 걸러냅니다.
    */
    window.receiveSchedule = function (data) {
      schedule =
        Array.isArray(data)
          ? data.filter(function (item) {
              const parts =
                String(item.date || "")
                  .split("-")
                  .map(Number);

              if (parts.length !== 3) {
                return false;
              }

              const date =
                new Date(
                  parts[0],
                  parts[1] - 1,
                  parts[2]
                );

              return date.getDay() !== 0;
            })
          : [];

      renderDates();
    };

    /*
      Apps Script의 일정 정보를 JSONP 방식으로 불러옵니다.
      GitHub Pages와 Apps Script의 주소가 달라도
      일정 정보를 가져올 수 있도록 구성한 방식입니다.
    */
    function loadSchedule() {
      dateSelect.disabled = true;

      dateSelect.innerHTML =
        '<option value="">' +
        "일정을 불러오는 중입니다…" +
        "</option>";

      const oldScript =
        document.getElementById("scheduleJsonp");

      if (oldScript) {
        oldScript.remove();
      }

      const script =
        document.createElement("script");

      script.id = "scheduleJsonp";

      script.src =
        API_URL +
        "?action=schedule" +
        "&callback=receiveSchedule" +
        "&_=" +
        Date.now();

      script.onerror = function () {
        dateSelect.innerHTML =
          '<option value="">' +
          "일정을 불러오지 못했습니다" +
          "</option>";

        showStatus(
          "일정 연결에 실패했습니다. 잠시 후 새로고침해 주세요.",
          "error"
        );
      };

      document.body.appendChild(script);
    }

    /*
      날짜 선택 목록을 생성합니다.
      마감된 날짜는 보이지만 선택할 수 없습니다.
    */
    function renderDates() {
      dateSelect.innerHTML =
        '<option value="">' +
        "활동 날짜를 선택해 주세요" +
        "</option>";

      schedule.forEach(function (item) {
        if (
  getDay(item.date) === 0 ||
  getDay(item.date) === 6
) {
  return;
}
        const option =
          document.createElement("option");

        option.value =
          item.date;

        option.textContent =
          item.displayDate;

        option.disabled =
          Boolean(item.disabled);

        dateSelect.appendChild(option);
      });

      dateSelect.disabled =
        schedule.length === 0;

      if (!schedule.length) {
        dateSelect.innerHTML =
          '<option value="">' +
          "현재 신청 가능한 일정이 없습니다" +
          "</option>";

        showStatus(
          "현재 신청 가능한 일정이 없습니다.",
          "info"
        );
      }
    }

    function getSelectedItem() {
      return schedule.find(function (item) {
        return item.date === dateSelect.value;
      });
    }

    function getDay(dateString) {
      const parts =
        dateString
          .split("-")
          .map(Number);

      return new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
      ).getDay();
    }

    function isSaturday(dateString) {
      return getDay(dateString) === 6;
    }

    /*
      선택한 날짜에 맞춰 시작시간을 생성합니다.

      평일: 09:00~17:00
      토요일: 09:00, 10:00, 11:00
    */
    function renderTimes() {
      const item =
        getSelectedItem();

      startSelect.innerHTML =
        '<option value="">' +
        "시작시간을 선택해 주세요" +
        "</option>";

      durationSelect.value = "";

      durationSelect.disabled =
        !item;

      startSelect.disabled =
        !item;

      document.getElementById(
        "dateHint"
      ).textContent =
        item && item.remaining <= 2
          ? "신청 가능 인원이 " +
            item.remaining +
            "명 남았습니다."
          : "";

      if (!item) {
        return;
      }

      const hours =
        isSaturday(item.date)
          ? [9, 10, 11]
          : [
              9,
              10,
              11,
              12,
              13,
              14,
              15,
              16,
              17
            ];

      hours.forEach(function (hour) {
        const value =
          String(hour).padStart(2, "0") +
          ":00";

        const option =
          new Option(value, value);

        startSelect.add(option);
      });

      updateTimeHint();
    }

    /*
      토요일에는 활동 종료시간이 13시를 넘는
      선택지를 자동으로 비활성화합니다.
    */
    function updateTimeHint() {
      const saturday =
        dateSelect.value &&
        isSaturday(dateSelect.value);

      document.getElementById(
        "timeHint"
      ).textContent =
        saturday
          ? "토요일 활동은 13:00까지 마쳐야 합니다."
          : "";

      Array
        .from(durationSelect.options)
        .forEach(function (option) {
          option.disabled = false;
        });

      if (
        saturday &&
        startSelect.value
      ) {
        const startHour =
          Number(
            startSelect.value.slice(0, 2)
          );

        Array
          .from(durationSelect.options)
          .forEach(function (option) {
            if (!option.value) {
              return;
            }

            option.disabled =
              startHour +
              Number(option.value) >
              13;
          });

        const selectedOption =
          durationSelect.selectedOptions[0];

        if (
          selectedOption &&
          selectedOption.disabled
        ) {
          durationSelect.value = "";
        }
      }
    }

    /*
      연락처에 하이픈을 자동으로 넣습니다.
    */
    phoneInput.addEventListener(
      "input",
      function () {
        const number =
          this.value
            .replace(/\D/g, "")
            .slice(0, 11);

        if (number.length < 4) {
          this.value = number;
        } else if (number.length < 8) {
          this.value =
            number.slice(0, 3) +
            "-" +
            number.slice(3);
        } else {
          this.value =
            number.slice(0, 3) +
            "-" +
            number.slice(3, 7) +
            "-" +
            number.slice(7);
        }
      }
    );

    dateSelect.addEventListener(
      "change",
      renderTimes
    );

    startSelect.addEventListener(
      "change",
      updateTimeHint
    );

    /*
      신청 내용을 Apps Script로 전송합니다.
    */
    form.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const selected =
          getSelectedItem();

        if (
          !selected ||
          selected.disabled
        ) {
          showStatus(
            "신청 가능한 날짜를 다시 선택해 주세요.",
            "error"
          );

          return;
        }

        /*
          홈페이지에서도 일요일 신청을 최종 차단합니다.
        */
        if (
          getDay(selected.date) === 0
        ) {
          showStatus(
            "일요일은 신청을 받지 않습니다.",
            "error"
          );

          return;
        }

        /*
          토요일 종료시간 검증
        */
        if (
          isSaturday(selected.date) &&
          Number(
            startSelect.value.slice(0, 2)
          ) +
          Number(durationSelect.value) >
          13
        ) {
          showStatus(
            "토요일은 오후 1시까지 활동을 마쳐야 합니다.",
            "error"
          );

          return;
        }

        form.action = API_URL;

        waitingForSubmit = true;

        submitButton.disabled = true;

        submitButton.textContent =
          "신청 처리 중…";

        showStatus(
          "신청 내용을 안전하게 전송하고 있습니다.",
          "info"
        );

        form.submit();
      }
    );

    /*
      Apps Script에서 보낸 신청 결과를 받습니다.
    */
    window.addEventListener(
      "message",
      function (event) {
        if (
          !waitingForSubmit ||
          event.source !== submitFrame.contentWindow
        ) {
          return;
        }

        const result =
          event.data;

        if (
          !result ||
          typeof result.success !== "boolean"
        ) {
          return;
        }

        waitingForSubmit = false;

        submitButton.disabled = false;

        submitButton.textContent =
          "신청하기";

        showStatus(
          result.message ||
            (
              result.success
                ? "신청이 완료되었습니다."
                : "신청하지 못했습니다."
            ),
          result.success
            ? "success"
            : "error"
        );

        /*
          신청 완료 후 입력값을 비우고
          최신 잔여 인원을 다시 불러옵니다.
        */
        if (result.success) {
          form.reset();

          startSelect.disabled = true;
          durationSelect.disabled = true;

          document.getElementById(
            "dateHint"
          ).textContent = "";

          document.getElementById(
            "timeHint"
          ).textContent = "";

          loadSchedule();
        }
      }
    );

    function showStatus(
      message,
      type
    ) {
      statusBox.textContent =
        message;

      statusBox.className =
        "status show " + type;
    }

    loadSchedule();
  </script>
</body>
</html>
